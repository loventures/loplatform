name: Build

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write # for sbt-dependency-submission

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: "temurin"
          cache: "sbt"

      - name: Set up SBT
        uses: sbt/setup-sbt@v1

      - name: Enable corepack
        run: corepack enable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "yarn"
          cache-dependency-path: "./frontend/*/yarn.lock"

      - name: Compile frontend
        working-directory: ./frontend
        shell: bash
        env:
          CI: true
          JAVA_OPTS: >
            -Xms1024M -Xmx1024M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
        run: >
          sbt --server --batch "install ; build"

      - name: Compile backend
        working-directory: ./backend
        shell: bash
        env:
          JAVA_OPTS: >
            -Xms4096M -Xmx4096M -Xss6M -XX:ReservedCodeCacheSize=256M -Dfile.encoding=UTF-8
        run: >
          sbt --server --batch
          "set deploy/frontendArchiveDir := Some(file(\"dev/null\"))"
          compile

      - name: Upload dependency graph
        uses: scalacenter/sbt-dependency-submission@d84eef4c09e633bcf5f113bcad7fd5e9af1baee9 # v3.2.3, sbt 2 support
        with:
          working-directory: ./backend
          modules-ignore: deploy_3 # missing frontend cars
